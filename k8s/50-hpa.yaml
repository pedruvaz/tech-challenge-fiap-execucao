apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: execucao
  namespace: tech-challenge # definido pela plataforma (Matheus)
  labels:
    app.kubernetes.io/name: execucao
    app.kubernetes.io/part-of: tech-challenge-fiap
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: execucao
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
